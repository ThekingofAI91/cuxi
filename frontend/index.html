<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" id="themeColorMeta" content="#0B0B0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>书斋对话 · 多智能体 RAG 学术助手</title>
<style>  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { overflow: hidden; }
  .app-layout { display: flex; height: 100vh; position: relative; z-index: 1; }
  .main-area { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .main-area.centered-empty { justify-content: center; }
  .hero-mono { display: none; }
  .brand { cursor: pointer; }
  /* 聊天界面不再展示其他名人：隐藏人物区，提供返回首页按钮 */
  .persona-section { display: none; }
  .back-top-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: transparent; border: 1px solid rgba(140, 140, 140, 0.45);
    color: inherit; font-family: inherit; font-size: 12px; letter-spacing: 1px;
    padding: 7px 14px; border-radius: 8px; cursor: pointer; flex-shrink: 0;
    transition: border-color 0.2s ease;
  }
  .back-top-btn:hover { border-color: currentColor; }
  .back-home-btn {
    width: 100%; padding: 11px 14px; margin-top: 12px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: transparent; border: 1px solid rgba(140, 140, 140, 0.45);
    color: inherit; font-family: inherit; font-size: 13px; letter-spacing: 1px;
    border-radius: 10px; cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .back-home-btn:hover { border-color: currentColor; background: rgba(128, 128, 128, 0.12); }
  .sidebar-mask {
    display: none; position: fixed; inset: 0;
    z-index: 15; opacity: 0; transition: opacity 0.25s;
  }
  .sidebar-mask.show { display: block; opacity: 1; }
  /* ===== 首页选择 ===== */
  .home-view {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 48px 32px; overflow-y: auto;
    background:
      radial-gradient(58% 42% at 84% -8%, rgba(212, 175, 105, 0.16), transparent 62%),
      radial-gradient(48% 38% at 8% 112%, rgba(88, 108, 190, 0.13), transparent 60%),
      radial-gradient(32% 28% at 55% 48%, rgba(170, 120, 220, 0.06), transparent 64%),
      linear-gradient(165deg, #0B0B12 0%, #141022 52%, #0A0A10 100%);
  }
  .home-view.hidden { display: none; }
  .home-view::after {
    content: "书";
    position: absolute; right: -24px; top: -52px;
    font-family: "Cormorant Garamond", "Playfair Display", Georgia, "Noto Serif SC", "Songti SC", "SimSun", serif;
    font-size: 340px; line-height: 1; color: rgba(240, 224, 200, 0.028);
    transform: rotate(9deg); pointer-events: none;
  }
  .home-brand { text-align: center; margin-bottom: 30px; }
  .home-brand .hb-mark {
    width: 46px; height: 46px; margin: 0 auto 14px;
    background: #C9A86A; color: #0B0B0E;
    display: flex; align-items: center; justify-content: center;
    font-family: "Cormorant Garamond", "Playfair Display", Georgia, "Noto Serif SC", "Songti SC", "SimSun", serif;
    font-size: 24px;
  }
  .home-brand h1 {
    font-size: 26px; font-weight: 600; letter-spacing: 12px; text-indent: 12px;
    color: #EFE9E0;
    font-family: "Cormorant Garamond", "Playfair Display", Georgia, "Noto Serif SC", "Songti SC", "SimSun", serif;
  }
  .home-brand p { font-size: 10px; letter-spacing: 4px; color: #6F6A62; margin-top: 10px; }
  .home-title { font-size: 10px; letter-spacing: 5px; color: #8A8580; margin-bottom: 24px; }
  .home-count { font-size: 9px; letter-spacing: 2px; margin-left: 8px; opacity: 0.8; }
  .home-cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 22px; max-width: 1120px; }
  .home-dots { display: none; }
  .hc-arrow { display: none; }
  .home-card {
    width: 320px; min-height: 380px; border-radius: 16px;
    padding: 26px 26px 20px; cursor: pointer;
    display: flex; flex-direction: column; position: relative; overflow: hidden;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .home-card:hover { transform: translateY(-6px); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45); }
  .home-card:active { transform: scale(0.985); }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to { opacity: 1; transform: none; }
  }
  @keyframes cardFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .home-card { animation: cardIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) backwards; }
  .home-card:nth-child(1) { animation-delay: 0.03s; }
  .home-card:nth-child(2) { animation-delay: 0.1s; }
  .home-card:nth-child(3) { animation-delay: 0.17s; }
  .home-card:nth-child(4) { animation-delay: 0.24s; }
  .home-card:nth-child(5) { animation-delay: 0.31s; }
  .home-card:nth-child(6) { animation-delay: 0.38s; }
  .hc-idx {
    position: absolute; left: 12px; bottom: 8px;
    font-family: "Cormorant Garamond", "Playfair Display", Georgia, serif;
    font-size: 15px; font-style: italic; letter-spacing: 1px;
    opacity: 0.35;
  }
  .home-card::before {
    content: ""; position: absolute; left: 0; top: 22px; bottom: 22px;
    width: 4px; border-radius: 0 2px 2px 0;
  }
  .home-card.theme-original::before { background: #D9A648; }
  .home-card.theme-paper::before { background: #A93A2B; }
  .home-card.theme-noir::before { background: #FF4A3C; }
  .home-card.theme-street::before { background: #FF4136; }
  .home-card.theme-live::before { background: #E63946; }
  .hc-text { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
  .hc-body { flex: 1; display: flex; flex-direction: column; align-items: flex-start; padding-top: 30px; }
  .hc-name { font-size: 22px; font-weight: 600; }
  .hc-desc { font-size: 11px; margin-top: 8px; line-height: 1.6; opacity: 0.75; }
  .hc-tagline { font-size: 12px; margin-top: 14px; line-height: 1.9; opacity: 0.6; font-style: italic; }
  .hc-enter {
    margin-top: 22px; padding-top: 14px; width: 100%;
    font-size: 11px; letter-spacing: 2px; opacity: 0.6;
    border-top: 1px solid currentColor; transition: opacity 0.2s ease;
  }
  .home-card:hover .hc-enter { opacity: 1; }
  .home-note { margin-top: 32px; font-size: 10px; color: #5F5A55; letter-spacing: 2px; }
  .home-card.theme-original {
    background: linear-gradient(150deg, #1D2230 0%, #131722 52%, #0E111A 100%);
    border: 1px solid rgba(217, 166, 72, 0.4); color: #ECE5D8;
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }
  .home-card.theme-paper {
    background: linear-gradient(150deg, #F7F1E2 0%, #EFE6D0 100%);
    border: 1px solid rgba(169, 58, 43, 0.35); color: #26221D;
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.3);
  }
  .home-card.theme-paper .hc-name { font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", Georgia, serif; letter-spacing: 3px; }
  .home-card.theme-noir {
    background: linear-gradient(150deg, #1A1A20 0%, #121217 55%, #0D0D11 100%);
    border: 1px solid rgba(255, 74, 60, 0.45); color: #EDEAE4;
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.04);
  }
  .home-card.theme-noir .hc-enter { font-family: Consolas, "Courier New", monospace; }
  .home-card.theme-street {
    background: linear-gradient(150deg, #18211C 0%, #111713 55%, #0D110F 100%);
    border: 1px solid rgba(45, 225, 194, 0.4); color: #F2F0EA;
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 65, 54, 0.08);
  }
  .home-card.theme-street .hc-enter { font-family: Consolas, "Courier New", monospace; }
  .home-card.theme-live {
    background: linear-gradient(150deg, #182647 0%, #101B30 55%, #0C1424 100%);
    border: 1px solid rgba(230, 57, 70, 0.5); color: #F5F2EC;
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 197, 61, 0.07);
  }
  .home-card.theme-live .hc-enter { font-family: Consolas, "Courier New", monospace; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, 0.32); }
  @media (max-width: 1100px) {
    .home-card { width: 280px; min-height: 340px; }
  }
  @media (max-width: 900px) {
    .sidebar { position: fixed; top: 0; bottom: 0; left: 0; transform: translateX(-105%); z-index: 20; }
    .sidebar.open { transform: translateX(0); }
    .menu-btn { display: flex; align-items: center; justify-content: center; }
  }


  body[data-theme='original'] {
    --bg0: #0b0d12;
    --bg1: #10131a;
    --bg2: #151922;
    --panel: rgba(21, 25, 34, 0.78);
    --border: rgba(255, 255, 255, 0.07);
    --border-strong: rgba(255, 255, 255, 0.14);
    --gold: #d9a648;
    --gold-bright: #f0c877;
    --gold-deep: #8a6d33;
    --text-hi: #ece5d8;
    --text-mid: #a49d92;
    --text-low: #6d675e;
    --danger: #e06c5f;
    --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
    --sans: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  
  
body[data-theme='original'] {
    font-family: var(--sans);
    background: var(--bg0);
    color: var(--text-hi);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body[data-theme='original']::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(60% 45% at 78% -8%, rgba(217, 166, 72, 0.10), transparent 62%),
      radial-gradient(45% 38% at 12% 108%, rgba(93, 120, 170, 0.08), transparent 60%),
      linear-gradient(180deg, var(--bg0), var(--bg1) 46%, #0c0e13);
    pointer-events: none; z-index: 0;
  }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(217, 166, 72, 0.22); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(217, 166, 72, 0.4); }

  .app-layout { display: flex; height: 100vh; position: relative; z-index: 1; }

  /* ===== 侧边栏 ===== */
  .sidebar {
    width: 300px; min-width: 300px;
    display: flex; flex-direction: column;
    background: var(--panel);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-right: 1px solid var(--border);
    padding: 20px 14px 14px;
    z-index: 20;
    transition: transform 0.28s ease;
  }
  .brand { display: flex; align-items: center; gap: 12px; padding: 2px 6px 18px; }
  .brand-mark {
    width: 40px; height: 40px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 19px; color: #1a1408;
    background: linear-gradient(135deg, var(--gold-bright), var(--gold-deep));
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(217, 166, 72, 0.28);
  }
  .brand-text h1 {
    font-family: var(--serif); font-size: 19px; font-weight: 700;
    letter-spacing: 3px; color: var(--text-hi);
  }
  .brand-text p { font-size: 11px; color: var(--text-low); margin-top: 2px; letter-spacing: 1px; }

  .new-chat-btn {
    width: 100%; padding: 11px 14px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: transparent; color: var(--gold-bright);
    border: 1px solid rgba(217, 166, 72, 0.35); border-radius: 12px;
    font-size: 14px; font-family: var(--sans); cursor: pointer;
    transition: all 0.2s ease;
  }
  .new-chat-btn:hover { background: rgba(217, 166, 72, 0.1); border-color: var(--gold); box-shadow: 0 4px 18px rgba(217,166,72,0.12); }

  .side-section { margin-top: 18px; }
  .side-label {
    font-size: 11px; color: var(--text-low); letter-spacing: 2px;
    padding: 0 6px 8px;
  }

  /* 角色卡片 */
  .char-cards { display: flex; flex-direction: column; gap: 8px; }
  .char-card {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 13px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.02);
    cursor: pointer; transition: all 0.2s ease;
    position: relative; overflow: hidden;
  }
  .char-card::before {
    content: ""; position: absolute; left: 0; top: 20%; bottom: 20%; width: 2.5px;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold-deep));
    border-radius: 2px; opacity: 0; transition: opacity 0.2s;
  }
  .char-card:hover { border-color: var(--border-strong); background: rgba(255,255,255,0.04); }
  .char-card.active { border-color: rgba(217,166,72,0.45); background: rgba(217,166,72,0.07); }
  .char-card.active::before { opacity: 1; }
  .char-avatar {
    width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 21px;
    background: linear-gradient(135deg, rgba(217,166,72,0.16), rgba(217,166,72,0.05));
    border: 1px solid rgba(217,166,72,0.35);
  }
  .char-card.active .char-avatar {
    box-shadow: 0 0 0 3px rgba(217,166,72,0.12), 0 6px 16px rgba(217,166,72,0.15);
  }
  .char-name { font-family: var(--serif); font-size: 15px; font-weight: 600; color: var(--text-hi); }
  .char-desc { font-size: 11px; color: var(--text-low); margin-top: 2px; line-height: 1.4; }

  /* 历史对话 */
  .conv-section { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .conversation-list { flex: 1; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
  .conv-item {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 10px; border-radius: 10px; cursor: pointer;
    transition: background 0.15s ease; position: relative;
  }
  .conv-item:hover { background: rgba(255,255,255,0.045); }
  .conv-item.active { background: rgba(217,166,72,0.08); }
  .conv-item.active::before {
    content: ""; position: absolute; left: 0; top: 22%; bottom: 22%; width: 2.5px;
    background: var(--gold); border-radius: 2px;
  }
  .conv-avatar {
    width: 30px; height: 30px; flex-shrink: 0; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
    background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.1);
    filter: grayscale(0.55); opacity: 0.6; transition: all 0.2s ease;
  }
  .conv-item:hover .conv-avatar { opacity: 0.9; }
  .conv-item.active .conv-avatar {
    filter: none; opacity: 1;
    background: linear-gradient(135deg, rgba(217,166,72,0.22), rgba(217,166,72,0.07));
    border-color: rgba(217,166,72,0.55);
    box-shadow: 0 0 0 2px rgba(217,166,72,0.14), 0 0 10px rgba(217,166,72,0.35);
    animation: convGlow 2.2s ease-in-out infinite;
  }
  @keyframes convGlow {
    0%, 100% { box-shadow: 0 0 0 2px rgba(217,166,72,0.14), 0 0 8px rgba(217,166,72,0.3); }
    50% { box-shadow: 0 0 0 2px rgba(217,166,72,0.2), 0 0 14px rgba(217,166,72,0.5); }
  }
  .conv-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .conv-title {
    font-size: 13px; color: var(--text-mid);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .conv-item.active .conv-title { color: var(--text-hi); }
  .conv-sub { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--text-low); }
  .conv-who { color: var(--gold-bright); opacity: 0.8; }
  .conv-item.active .conv-who { opacity: 1; }
  .conv-time { font-size: 10px; color: var(--text-low); flex-shrink: 0; }
  .conv-del {
    display: none; flex-shrink: 0; width: 20px; height: 20px;
    border: none; border-radius: 6px; background: transparent;
    color: var(--text-low); font-size: 14px; line-height: 1; cursor: pointer;
    align-items: center; justify-content: center; transition: all 0.15s;
  }
  .conv-item:hover .conv-del { display: flex; }
  .conv-del:hover { background: rgba(224,108,95,0.14); color: var(--danger); }
  .conv-empty { padding: 24px 10px; text-align: center; color: var(--text-low); font-size: 12px; letter-spacing: 1px; }

  .sidebar-footer {
    padding: 12px 6px 2px; border-top: 1px solid var(--border);
    font-size: 10.5px; color: var(--text-low); text-align: center; letter-spacing: 0.5px;
  }

  /* ===== 主区域 ===== */
  .main-area { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .main-area.centered-empty { justify-content: center; }

  .topbar {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 26px;
    border-bottom: 1px solid var(--border);
    background: rgba(16, 19, 26, 0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .menu-btn {
    display: none; width: 34px; height: 34px; border: 1px solid var(--border);
    border-radius: 9px; background: transparent; color: var(--text-mid);
    font-size: 16px; cursor: pointer;
  }
  .topbar-persona { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .top-avatar {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 19px;
    background: linear-gradient(135deg, rgba(217,166,72,0.18), rgba(217,166,72,0.05));
    border: 1px solid rgba(217,166,72,0.4);
  }
  .top-name { font-family: var(--serif); font-size: 15px; font-weight: 600; }
  .top-sub { font-size: 11px; color: var(--text-low); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-status { margin-left: auto; display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-low); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #59b878; box-shadow: 0 0 8px rgba(89,184,120,0.55); }
  .status-dot.busy { background: var(--gold); box-shadow: 0 0 8px rgba(217,166,72,0.6); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .chat-container { flex: 1; overflow-y: auto; }
  .chat-scroll { max-width: 780px; margin: 0 auto; padding: 12px 28px 28px; }
  .main-area.centered-empty .chat-container { flex: 0 0 auto; overflow: visible; }
  .main-area.centered-empty .chat-scroll { padding-bottom: 8px; }
  .main-area.centered-empty .input-area { border-top: none; }

  /* ===== 消息 ===== */
  .message-group { padding: 22px 0; border-bottom: 1px solid rgba(255,255,255,0.045); }
  .message-group:last-child { border-bottom: none; }
  .message-row { display: flex; gap: 15px; align-items: flex-start; }
  .message-row.user-row { flex-direction: row-reverse; }

  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 19px;
    margin-top: 2px;
  }
  .avatar.user {
    background: linear-gradient(135deg, #3b2f1c, #2c2416);
    border: 1px solid rgba(217,166,72,0.3);
  }
  .avatar.assistant {
    background: linear-gradient(135deg, rgba(217,166,72,0.2), rgba(217,166,72,0.06));
    border: 1px solid rgba(217,166,72,0.42);
    box-shadow: 0 4px 14px rgba(217,166,72,0.12);
  }

  .message-content { flex: 1; min-width: 0; font-size: 15px; line-height: 1.85; color: var(--text-hi); word-wrap: break-word; }
  .user-text {
    display: inline-block; max-width: 100%;
    padding: 11px 17px; border-radius: 16px 16px 4px 16px;
    background: linear-gradient(135deg, #3a2f1d, #2b2517);
    border: 1px solid rgba(217,166,72,0.22);
    font-size: 14.5px; line-height: 1.7;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  }
  .message-content p { margin-bottom: 10px; }
  .message-content p:last-child { margin-bottom: 0; }
  .message-content .md-body { font-family: var(--serif); font-size: 15.5px; }

  /* Markdown */
  .md-body h1, .md-body h2, .md-body h3, .md-body h4 { margin: 18px 0 9px; font-weight: 700; font-family: var(--serif); }
  .md-body h1 { font-size: 19px; } .md-body h2 { font-size: 17px; } .md-body h3 { font-size: 15.5px; } .md-body h4 { font-size: 14.5px; }
  .md-body ul, .md-body ol { margin: 8px 0; padding-left: 22px; }
  .md-body li { margin-bottom: 4px; }
  .md-body code {
    background: rgba(255,255,255,0.07); padding: 2px 6px; border-radius: 5px;
    font-size: 12.5px; font-family: "Cascadia Code", "Fira Code", Consolas, monospace; color: var(--gold-bright);

<script>
"use strict";
// ============================================================
// 状态
// ============================================================
const state = {
  sessionId: crypto.randomUUID(),
  conversations: [],
  currentConversation: null,
  isLoading: false,
  currentScene: 'persona',
  view: 'home',
  currentCharacter: 'jung',
  characters: [],
  _msgQueue: [],
  _animateFromIndex: 0,
  _pendingQuestions: [],
  _streamingText: '',
  _isStreaming: false,
  _gotToken: false,
  _reqStart: 0,
};

const SUGGESTIONS = {
  jung: [
    "我反复梦见同一栋老房子，它想告诉我什么？",
    "什么是“阴影”？人为什么要面对它？",
    "人到中年感到迷茫空虚，您怎么看？",
    "怎样理解“个体化”这个过程？",
  ],
  adler: [
    "我总觉得自己不如别人，是怎么回事？",
    "童年经历对一个人的一生影响有多大？",
    "什么是“生活方式”？它是如何形成的？",
    "如何克服自卑、找回真正的勇气？",
  ],
};
const DEFAULT_SUGGESTIONS = [
  "您如何看待我此刻的困惑？",
  "请结合您的著作谈谈您的核心思想",
];

// DOM
const chatScroll = document.getElementById('chatScroll');
const chatContainer = document.getElementById('chatContainer');
const queryInput = document.getElementById('queryInput');
const sendBtn = document.getElementById('sendBtn');
const emptyState = document.getElementById('emptyState');
const newChatBtn = document.getElementById('newChatBtn');
const conversationList = document.getElementById('conversationList');
const charCards = document.getElementById('charCards');
const topbarPersona = document.getElementById('topbarPersona');
const topAvatar = document.getElementById('topAvatar');
const topName = document.getElementById('topName');
const topDesc = document.getElementById('topDesc');
const heroAvatar = document.getElementById('heroAvatar');
const heroMono = document.getElementById('heroMono');
const heroName = document.getElementById('heroName');
const heroDesc = document.getElementById('heroDesc');
const heroGreet = document.getElementById('heroGreet');
const suggestionChips = document.getElementById('suggestionChips');
const charHint = document.getElementById('charHint');
const sidebar = document.getElementById('sidebar');
const sidebarMask = document.getElementById('sidebarMask');
const brandMark = document.getElementById('brandMark');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const homeView = document.getElementById('homeView');
const homeCards = document.getElementById('homeCards');
const homeCount = document.getElementById('homeCount');
const homeDots = document.getElementById('homeDots');

// ============================================================
// 主题：按角色切换三种视觉风格（original / paper / noir）
// ============================================================
const THEME_MAP = {
  jung: 'original',
  adler: 'noir',
  fengge: 'street',
  zhangxuefeng: 'live',
  wangyangming: 'paper',
  plato: 'paper',
  aristotle: 'paper',
  socrates: 'noir',
  einstein: 'noir',
  marx: 'noir',
};
const THEMES = ['original', 'paper', 'noir', 'street', 'live'];

function themeFor(charId) {
  const c = state.characters.find(x => x.id === charId);
  if (c && THEMES.includes(c.theme)) return c.theme;
  return THEME_MAP[charId] || 'original';
}

function applyTheme(theme) {
  document.body.dataset.theme = theme;
  if (brandMark) {
    brandMark.textContent = theme === 'paper' ? '书' : theme === 'original' ? '✦' : '';
  }
  const themeColorMeta = document.getElementById('themeColorMeta');
  if (themeColorMeta) {
    const bg = { original: '#0B0D12', paper: '#EFE9DC', noir: '#0C0C0E', street: '#0E1210', live: '#0B1220' }[theme] || '#0B0B0E';
    themeColorMeta.content = bg;
  }
  const hint = document.getElementById('inputHint');
  if (hint) {
    hint.textContent = (theme === 'street' || theme === 'live') ? '对话基于公开言论生成' : '原著检索 · 引用可查';
  }
}

const FALLBACK_CHARACTERS = [
  { id: 'jung', name: '卡尔·荣格', avatar: '🧔', description: '梦里乾坤，荣格解魂', tagline: '梦见老宅别乱猜，荣格开口梦全开。' },
  { id: 'adler', name: '阿尔弗雷德·阿德勒', avatar: '🧑‍🦳', description: '爱里迷路，阿德勒指路', tagline: '情场失意别发怵，阿德勒一聊心里有数。' },
];

function renderHome() {
  const list = state.characters.length > 0 ? state.characters : FALLBACK_CHARACTERS;
  if (homeCount) homeCount.textContent = list.length + ' 位人物';
  homeCards.innerHTML = list.map((c, i) => {
    const t = themeFor(c.id);
    const idx = String(i + 1).padStart(2, '0');
    return `<div class="home-card theme-${t}" data-char-id="${escapeHtml(c.id)}">
      <div class="hc-body">
        <div class="hc-text">
          <div class="hc-name">${escapeHtml(c.name)}</div>
          <div class="hc-desc">${escapeHtml(c.description || '')}</div>
        </div>
        <div class="hc-tagline">${escapeHtml(c.tagline || '')}</div>
      </div>
      <div class="hc-enter">进入对话 →</div>
      <span class="hc-idx">${idx}</span>
    </div>`;
  }).join('');
  homeCards.querySelectorAll('.home-card').forEach(el => {
    el.addEventListener('click', () => {
      if (cardStack.suppressClick || cardCarousel.suppressClick) {
        cardStack.suppressClick = false;
        cardCarousel.suppressClick = false;
        return;
      }
      if (state.isLoading) return;
      enterChat(el.dataset.charId);
    });
  });
  initHomeCardsLayout();
}

// ============================================================
// 移动端首页：名片堆叠轮播（自动轮动 + 手势拨动）
// ============================================================
const cardStack = {
  mq: window.matchMedia('(max-width: 640px)'),
  enabled: false,
  index: 0,
  timer: null,
  token: 0,
  drag: null,
  suppressClick: false,
  bound: false,
};

function initCardStack() {
  const cards = [...homeCards.querySelectorAll('.home-card')];
  if (!cards.length) return;
  cardStack.enabled = true;
  cardStack.index = Math.min(cardStack.index, cards.length - 1);
  buildDots();
  cardStackLayout();
  cardStackSchedule();
  if (!cardStack.bound) {
    cardStack.bound = true;
    homeCards.addEventListener('pointerdown', onStackPointerDown);
    window.addEventListener('pointermove', onStackPointerMove);
    window.addEventListener('pointerup', onStackPointerUp);
    window.addEventListener('pointercancel', onStackPointerUp);
  }
}

function cardStackLayout(skip) {
  const cards = [...homeCards.querySelectorAll('.home-card')];
  const n = cards.length;
  if (!n) return;
  cards.forEach((el, i) => {
    if (el === skip) return;
    const d = (i - cardStack.index + n) % n;
    el.style.zIndex = String(40 - d);
    if (d === 0) {
      el.classList.add('is-top');
      el.style.transform = 'none';
      el.style.opacity = '1';
    } else {
      el.classList.remove('is-top');
      el.style.transform = `translateY(${16 * d}px) scale(${(1 - d * 0.028).toFixed(3)})`;
      el.style.opacity = String(Math.max(1 - d * 0.14, 0.5));
    }
  });
  updateDots();
}

function cardStackSchedule() {
  clearTimeout(cardStack.timer);
  if (!cardStack.enabled) return;
  if (!homeView || homeView.classList.contains('hidden')) return;
  cardStack.timer = setTimeout(() => {
    cardStackGo(1);
  }, 4200);
}

function cardStackGo(step) {
  if (!cardStack.enabled) return;
  if (!homeView || homeView.classList.contains('hidden')) return;
  const cards = [...homeCards.querySelectorAll('.home-card')];
  const n = cards.length;
  if (n < 2) return;
  clearTimeout(cardStack.timer);
  const token = ++cardStack.token;
  const from = cards[cardStack.index];
  cardStack.index = ((cardStack.index + step) % n + n) % n;
  if (from) {
    from.classList.add('is-leaving');
    from.style.zIndex = '60';
    from.style.transform = `translateX(${step > 0 ? -130 : 130}%) rotate(${step > 0 ? -8 : 8}deg)`;
    from.style.opacity = '0';
    cardStackLayout(from);
    setTimeout(() => {
      if (token !== cardStack.token) return;
      from.classList.remove('is-leaving', 'is-top');
      const d = n - 1;
      from.style.transition = 'none';
      from.style.zIndex = String(40 - d);
      from.style.transform = `translateY(${16 * d}px) scale(${(1 - d * 0.028).toFixed(3)})`;
      from.style.opacity = String(Math.max(1 - d * 0.14, 0.5));
      void from.offsetWidth;
      from.style.transition = '';
    }, 480);
  } else {
    cardStackLayout();
  }
  cardStackSchedule();
}

function onStackPointerDown(e) {
  if (!cardStack.enabled) return;
  const card = e.target.closest('.home-card');
  if (!card || !card.classList.contains('is-top')) return;
  clearTimeout(cardStack.timer);
  cardStack.suppressClick = false;
  card.style.transition = 'none';
  cardStack.drag = {
    id: e.pointerId,
    x: e.clientX,
    y: e.clientY,
    dx: 0,
    moved: false,
    card,
    t: performance.now(),
  };
  try { card.setPointerCapture(e.pointerId); } catch (_) {}
}

function onStackPointerMove(e) {
  const d = cardStack.drag;
  if (!d || e.pointerId !== d.id || !d.card) return;
  const dx = e.clientX - d.x;
  const dy = e.clientY - d.y;
  if (!d.moved && Math.hypot(dx, dy) > 8) d.moved = true;
  if (!d.moved) return;
  d.dx = dx;
  d.card.style.transform = `translateX(${dx}px) rotate(${dx * 0.035}deg)`;
  d.card.style.opacity = String(Math.max(1 - Math.abs(dx) / 320, 0.35));
}

function onStackPointerUp(e) {
  const d = cardStack.drag;
  if (!d || e.pointerId !== d.id) return;
  cardStack.drag = null;
  const card = d.card;
  if (!d.moved) {
    card.style.transition = '';
    cardStackSchedule();
    return;
  }
  cardStack.suppressClick = true;
  const vx = (e.clientX - d.x) / Math.max(performance.now() - d.t, 1);
  if (Math.abs(d.dx) > 80 || Math.abs(vx) > 0.6) {
    card.style.transition = '';
    cardStackGo(d.dx > 0 ? -1 : 1);
  } else {
    card.style.transition = 'transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease';
    card.style.transform = 'none';
    card.style.opacity = '1';
    setTimeout(() => {
      if (!cardStack.drag) card.style.transition = '';
    }, 420);
    cardStackSchedule();
  }
}

// ============================================================
// 桌面首页：横向轮播（居中主卡 + 左右露出 + 自动轮动/拖动/箭头）
// ============================================================
const cardCarousel = {
  enabled: false,
  index: 0,
  timer: null,
  drag: null,
  suppressClick: false,
  bound: false,
  gap: 300,
};

function buildDots() {
  const cards = [...homeCards.querySelectorAll('.home-card')];
  homeDots.innerHTML = cards.map((_, i) =>
    `<button class="hd-dot" data-i="${i}" aria-label="第 ${i + 1} 位人物"></button>`
  ).join('');
  homeDots.querySelectorAll('.hd-dot').forEach(dot => {
    dot.addEventListener('click', () => {
      const n = cards.length;
      const i = Number(dot.dataset.i);
      const cur = cardStack.enabled ? cardStack.index : cardCarousel.index;
      if (i === cur) return;
      const fwd = (i - cur + n) % n;
      const step = fwd <= n - fwd ? fwd : -(n - fwd);
      if (cardStack.enabled) cardStackGo(step);
      else cardCarouselGo(step);
    });
  });
  updateDots();
}

function updateDots() {
  const cur = cardStack.enabled ? cardStack.index : cardCarousel.index;
  homeDots.querySelectorAll('.hd-dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === cur);
  });
}

function initCardCarousel() {
  const cards = [...homeCards.querySelectorAll('.home-card')];
  if (!cards.length) return;
  cardCarousel.enabled = true;
  cardCarousel.index = Math.min(cardCarousel.index, cards.length - 1);
  cardCarousel.gap = parseFloat(getComputedStyle(homeCards).getPropertyValue('--carousel-gap')) || 300;
  buildDots();
  carouselLayout();
  cardCarouselSchedule();
  if (!cardCarousel.bound) {
    cardCarousel.bound = true;
    homeCards.addEventListener('pointerdown', onCarouselPointerDown);
    window.addEventListener('pointermove', onCarouselPointerMove);
    window.addEventListener('pointerup', onCarouselPointerUp);
    window.addEventListener('pointercancel', onCarouselPointerUp);
    const prevBtn = document.getElementById('homePrevBtn');
    const nextBtn = document.getElementById('homeNextBtn');
    if (prevBtn) prevBtn.addEventListener('click', () => cardCarouselGo(-1));
    if (nextBtn) nextBtn.addEventListener('click', () => cardCarouselGo(1));
  }
}

function carouselLayout() {
  const cards = [...homeCards.querySelectorAll('.home-card')];
  const n = cards.length;
  if (!n) return;
  cards.forEach((el, i) => {
    const d = (i - cardCarousel.index + n) % n;
    const dist = d <= n - d ? d : -(n - d);
    const ad = Math.abs(dist);
    el.style.zIndex = String(30 - ad);
    if (dist === 0) {
      el.classList.add('is-active');
      el.style.transform = 'translate(-50%, -50%) translateX(0) scale(1)';
      el.style.opacity = '1';
    } else {
      el.classList.remove('is-active');
      const sc = Math.max(1 - ad * 0.1, 0.8);
      const op = Math.max(1 - ad * 0.28, 0.4);
      el.style.transform = `translate(-50%, -50%) translateX(${dist * cardCarousel.gap}px) scale(${sc.toFixed(3)})`;
      el.style.opacity = String(op);
    }
  });
  updateDots();
}

function cardCarouselSchedule() {
  clearTimeout(cardCarousel.timer);
  if (!cardCarousel.enabled) return;
  if (!homeView || homeView.classList.contains('hidden')) return;
  cardCarousel.timer = setTimeout(() => {
    cardCarouselGo(1);
  }, 4600);
}

function cardCarouselGo(step) {
  if (!cardCarousel.enabled) return;
  if (!homeView || homeView.classList.contains('hidden')) return;
  const cards = [...homeCards.querySelectorAll('.home-card')];
  const n = cards.length;
  if (n < 2) return;
  clearTimeout(cardCarousel.timer);
  cardCarousel.index = ((cardCarousel.index + step) % n + n) % n;
  carouselLayout();
  cardCarouselSchedule();
}

function onCarouselPointerDown(e) {
  if (!cardCarousel.enabled) return;
  const card = e.target.closest('.home-card');
  if (!card) return;
  cardCarousel.suppressClick = false;
  clearTimeout(cardCarousel.timer);
  homeCards.style.transition = 'none';
  cardCarousel.drag = {
    id: e.pointerId,
    x: e.clientX,
    y: e.clientY,
    dx: 0,
    moved: false,
    t: performance.now(),
  };
  try { card.setPointerCapture(e.pointerId); } catch (_) {}
}

function onCarouselPointerMove(e) {
  const d = cardCarousel.drag;
  if (!d || e.pointerId !== d.id) return;
  const dx = e.clientX - d.x;
  const dy = e.clientY - d.y;
  if (!d.moved && Math.hypot(dx, dy) > 6) d.moved = true;
  if (!d.moved) return;
  d.dx = dx;
  homeCards.style.transform = `translateX(${dx}px)`;
}

function onCarouselPointerUp(e) {
  const d = cardCarousel.drag;
  if (!d || e.pointerId !== d.id) return;
  cardCarousel.drag = null;
  const dx = d.dx;
  homeCards.style.transition = 'transform 0.45s cubic-bezier(0.22, 1, 0.36, 1)';
  if (!d.moved) {
    homeCards.style.transition = '';
    cardCarouselSchedule();
    return;
  }
  cardCarousel.suppressClick = true;
  const vx = (e.clientX - d.x) / Math.max(performance.now() - d.t, 1);
  homeCards.style.transform = 'translateX(0)';
  if (Math.abs(dx) > 100 || Math.abs(vx) > 0.6) {
    cardCarouselGo(dx > 0 ? -1 : 1);
  } else {
    setTimeout(() => {
      if (!cardCarousel.drag) homeCards.style.transition = '';
    }, 460);
    cardCarouselSchedule();
  }
}

function cardStackTeardown() {
  cardStack.enabled = false;
  clearTimeout(cardStack.timer);
  cardStack.drag = null;
  homeCards.querySelectorAll('.home-card').forEach(el => {
    el.style.transform = '';
    el.style.opacity = '';
    el.style.zIndex = '';
    el.style.transition = '';
    el.classList.remove('is-top', 'is-leaving');
  });
}

function cardCarouselTeardown() {
  cardCarousel.enabled = false;
  clearTimeout(cardCarousel.timer);
  cardCarousel.drag = null;
  homeCards.style.transform = '';
  homeCards.style.transition = '';
  homeCards.querySelectorAll('.home-card').forEach(el => {
    el.style.transform = '';
    el.style.opacity = '';
    el.style.zIndex = '';
    el.style.transition = '';
    el.classList.remove('is-active');
  });
}

function initHomeCardsLayout() {
  if (cardStack.mq.matches) {
    cardCarouselTeardown();
    initCardStack();
  } else {
    cardStackTeardown();
    initCardCarousel();
  }
}

if (!window.__homeLayoutBound) {
  window.__homeLayoutBound = true;
  cardStack.mq.addEventListener('change', () => {
    if (homeView && !homeView.classList.contains('hidden')) initHomeCardsLayout();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      clearTimeout(cardStack.timer);
      clearTimeout(cardCarousel.timer);
    } else if (homeView && !homeView.classList.contains('hidden')) {
      cardStackSchedule();
      cardCarouselSchedule();
    }
  });
}

function showHome() {
  state.view = 'home';
  homeView.classList.remove('hidden');
  renderHome();
  closeSidebar();
}

function enterChat(charId) {
  state.view = 'chat';
  homeView.classList.add('hidden');
  if (state.currentCharacter !== charId) {
    switchCharacter(charId);
  } else {
    applyTheme(themeFor(charId));
    updateEmptyState();
    renderConversations();
    renderMessages();
  }
}

// ============================================================
// 工具
// ============================================================
function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function formatTime() {
  return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
}

function formatConvTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  const yesterday = new Date(now.getTime() - 86400000);
  if (d.toDateString() === yesterday.toDateString()) return '昨天';
  return `${d.getMonth() + 1}月${d.getDate()}日`;
}

function scrollToBottom() {
  requestAnimationFrame(() => { chatContainer.scrollTop = chatContainer.scrollHeight; });
}

function autoResize(textarea) {
  textarea.style.height = 'auto';
  textarea.style.height = Math.min(textarea.scrollHeight, 190) + 'px';
}

function currentChar() {
  return state.characters.find(c => c.id === state.currentCharacter) || null;
}

function getConversationCharacter(conv) {
  if (!conv) return null;
  // 优先按消息记录判断实际对话对象：消息中的角色头像是最可靠的证据
  // （characterId 可能被历史 bug 改写或复用逻辑重写，消息 sceneIcon 记录的是当时真实对话对象）
  for (const m of conv.messages || []) {
    const icon = m.extra?.sceneIcon;
    if (icon) {
      const found = state.characters.find(c => c.avatar === icon);
      if (found) return found.id;
    }
  }
  // 无消息或消息中无角色标记时，回退到 characterId
  const cid = conv.characterId;
  if (cid && state.characters.some(c => c.id === cid)) return cid;
  return null;
}

// 当前人物的对话列表（聊天界面不展示其他名人的会话）
function currentCharacterConvs() {
  return state.conversations.filter(c =>
    (!c.scene || c.scene === state.currentScene) &&
    (getConversationCharacter(c) || c.characterId) === state.currentCharacter
  );
}

// 后端权威核对：历史对话与谁对话，以后端记录为准（优先级最高）
// 后端只在会话"首次提问"时记录角色，不会被切换角色的操作改写，最可信。
// 点击历史对话 / 页面恢复时调用：若后端有记录且与本地判断不一致，
// 以后端为准修正并自愈本地数据（characterId + 消息 sceneIcon），
// 即使刷新/重启后本地判断也能稳定返回正确角色。
function verifyConversationOwner(conv) {
  if (!conv || !conv.sessionId) return;
  fetch('/conversation/' + encodeURIComponent(conv.sessionId) + '/meta')
    .then(r => r.json())
    .then(meta => {
      if (!meta || !meta.known || !meta.character) return; // 后端无记录：保持本地判断
      const local = getConversationCharacter(conv);
      if (meta.character === local) return; // 本地与后端一致：无需处理
      // 以历史对话的对象为最高优先级：后端权威覆盖本地（修复被污染的数据）
      conv.characterId = meta.character;
      const cdef = state.characters.find(c => c.id === meta.character) || null;
      if (cdef) {
        (conv.messages || []).forEach(m => {
          if (m.type === 'assistant') {
            m.extra = Object.assign({}, m.extra || {}, { sceneIcon: cdef.avatar });
          }
        });
      }
      if (state.currentConversation === conv) {
        state.currentCharacter = meta.character;
        applyTheme(themeFor(meta.character));
        updateEmptyState();
        charCards.querySelectorAll('.char-card').forEach(c =>
          c.classList.toggle('active', c.dataset.charId === meta.character)
        );
        renderMessages();
      }
      saveState();
      renderConversations();
    })
    .catch(() => { /* 后端核对失败不影响本地逻辑 */ });
}

function getAssistantIcon() {
  return currentChar()?.avatar || '🧔';
}

// ============================================================
// 持久化（localStorage + sessionStorage 双写）
// ============================================================
const STORAGE_KEY = 'multi_agent_rag_state';

function saveState() {
  try {
    const data = {
      conversations: state.conversations,
      currentConversationId: state.currentConversation?.id || null,
      currentScene: state.currentScene,
      currentCharacter: state.currentCharacter,
      sessionId: state.sessionId,
    };
    sessionStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) { /* 忽略存储配额超限 */ }
}

function loadState() {
  try {
    let raw = sessionStorage.getItem(STORAGE_KEY);
    if (!raw) raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (data.conversations && data.conversations.length > 0) {
      state.conversations = (data.conversations || [])
        .filter(c => !c.scene || c.scene === 'persona')
        .map(c => { delete c._fromHistory; return c; });
      state.currentScene = 'persona';
      state.currentCharacter = data.currentCharacter || 'jung';
      state.sessionId = data.sessionId || crypto.randomUUID();
      if (data.currentConversationId) {
        state.currentConversation = state.conversations.find(
          c => c.id === data.currentConversationId && (!c.scene || c.scene === state.currentScene)
        ) || null;
      }
      if (!state.currentConversation) {
        const sceneConvs = state.conversations.filter(c => !c.scene || c.scene === state.currentScene);
        state.currentConversation = sceneConvs.length > 0 ? sceneConvs[sceneConvs.length - 1] : null;
      }
      if (state.currentConversation) {
        if (state.currentConversation.sessionId) {
          state.sessionId = state.currentConversation.sessionId;
        } else {
          state.currentConversation.sessionId = state.sessionId || crypto.randomUUID();
          state.sessionId = state.currentConversation.sessionId;
        }
        // 恢复对话对应的角色（按对话实际归属判断，保持与侧边栏一致）
        const restoredCid = getConversationCharacter(state.currentConversation);
        if (restoredCid) {
          state.currentCharacter = restoredCid;
        }
      }
      return true;
    }
  } catch (e) { console.warn('[持久化] 恢复失败:', e); }
  return false;
}

// ============================================================
// 空状态 & 角色
// ============================================================
function updateEmptyState() {
  const char = currentChar();
  if (heroAvatar) heroAvatar.textContent = char?.avatar || '🧔';
  if (heroMono) heroMono.textContent = (char?.name || '').charAt(0) || '';
  if (heroName) heroName.textContent = char?.name || '对话';
  if (heroDesc) heroDesc.textContent = char?.description || '';
  if (heroGreet) heroGreet.textContent = char?.tagline || '与历史伟人对谈，在对话中照见自己。';
  if (topAvatar) topAvatar.textContent = char?.avatar || '🧔';
  if (topName) topName.textContent = char?.name || '';
  if (topDesc) topDesc.textContent = char?.description || '';
  if (charHint) charHint.textContent = `当前与「${char?.name || ''}」对话`;
  renderSuggestions();
}

function renderSuggestions() {
  const charId = state.currentCharacter;
  const list = SUGGESTIONS[charId] || DEFAULT_SUGGESTIONS;
  suggestionChips.innerHTML = '';
  list.forEach(q => {
    const chip = document.createElement('button');
    chip.className = 'suggestion-chip';
    chip.textContent = q;
    chip.addEventListener('click', () => { if (!state.isLoading) sendQuery(q); });
    suggestionChips.appendChild(chip);
  });
}

function updateEmptyLayout() {
  const isPersonaEmpty = !state.currentConversation || state.currentConversation.messages.length === 0;
  document.querySelector('.main-area').classList.toggle('centered-empty', isPersonaEmpty);
  // 空对话时中间已展示人物卡片，左上角不再重复显示人物（有消息后恢复显示）
  if (topbarPersona) topbarPersona.style.display = isPersonaEmpty ? 'none' : '';
}

async function loadCharacters() {
  try {
    const resp = await fetch('/persona/characters');
    if (!resp.ok) return;
    const data = await resp.json();
    state.characters = data.characters || [];

    charCards.innerHTML = '';
    state.characters.forEach(char => {
      const card = document.createElement('div');
      card.className = 'char-card' + (char.id === state.currentCharacter ? ' active' : '');
      card.dataset.charId = char.id;
      card.innerHTML = `
        <span class="char-avatar">${escapeHtml(char.avatar || '🎭')}</span>
        <div>
          <div class="char-name">${escapeHtml(char.name)}</div>
          <div class="char-desc">${escapeHtml(char.description || '')}</div>
        </div>`;
      card.addEventListener('click', () => switchCharacter(char.id));
      charCards.appendChild(card);
    });

    updateEmptyState();
    updateEmptyLayout();
    // 角色数据就绪后刷新侧边栏：历史对话头像/名字 + 当前对话角色高亮
    if (state.conversations.length > 0) {
      const cid = getConversationCharacter(state.currentConversation);
      if (cid && cid !== state.currentCharacter) {
        state.currentCharacter = cid;
        applyTheme(themeFor(cid));
        updateEmptyState();
        charCards.querySelectorAll('.char-card').forEach(c =>
          c.classList.toggle('active', c.dataset.charId === cid)
        );
      }
      renderConversations();
      // 页面恢复时也用后端权威记录核对当前对话归属
      verifyConversationOwner(state.currentConversation);
    }
  } catch (e) {
    console.warn('[App] 加载角色列表失败:', e);
  }
  if (state.view === 'home') renderHome();
}

function switchCharacter(charId) {
  if (charId === state.currentCharacter) return;
  state.currentCharacter = charId;
  applyTheme(themeFor(charId));
  state.sessionId = crypto.randomUUID();
  updateEmptyState();
  newConversation();
  charCards.querySelectorAll('.char-card').forEach(c =>
    c.classList.toggle('active', c.dataset.charId === charId)
  );
  closeSidebar();
}

// ============================================================
// 对话管理
// ============================================================
function newConversation() {
  if (state.currentConversation) {
    state.currentConversation._draft = queryInput.value;
  }
  if (state.currentConversation
      && state.currentConversation.messages.length === 0
      && !state.currentConversation._fromHistory
      && (!state.currentConversation.scene || state.currentConversation.scene === state.currentScene)) {
    state.sessionId = crypto.randomUUID();
    state.currentConversation.sessionId = state.sessionId;
    state.currentConversation.title = '新对话';
    state.currentConversation.characterId = state.currentCharacter;
    saveState();
    renderConversations();
    renderMessages();
    queryInput.value = state.currentConversation._draft || '';
    queryInput.focus();
    emptyState.style.display = 'flex';
    return;
  }

  // 查找其他可复用的空对话：避免重复创建空对话（如点开历史对话后再切换角色）
  const reusable = state.conversations.find(c =>
      (!c.messages || c.messages.length === 0)
      && (!c.scene || c.scene === state.currentScene));
  if (reusable) {
    state.currentConversation = reusable;
    delete reusable._fromHistory;
    state.sessionId = crypto.randomUUID();
    reusable.sessionId = state.sessionId;
    reusable.title = '新对话';
    reusable.characterId = state.currentCharacter;
    saveState();
    renderConversations();
    renderMessages();
    queryInput.value = reusable._draft || '';
    queryInput.focus();
    emptyState.style.display = 'flex';
    return;
  }

  state.sessionId = crypto.randomUUID();
  state.currentConversation = {
    id: crypto.randomUUID(),
    title: '新对话',
    messages: [],
    createdAt: Date.now(),
    sessionId: state.sessionId,
    scene: state.currentScene,
    characterId: state.currentCharacter,
  };
  state.conversations.push(state.currentConversation);
  saveState();
  renderConversations();
  renderMessages();
  queryInput.value = '';
  queryInput.focus();
  emptyState.style.display = 'flex';
}

function addMessage(type, content, extra = {}) {
  if (!state.currentConversation) newConversation();
  if (!state.currentConversation.sessionId) {
    state.currentConversation.sessionId = state.sessionId;
  }
  state.currentConversation.messages.push({ type, content, extra, time: Date.now() });
  if (type === 'user' && state.currentConversation.messages.length === 1) {
    state.currentConversation.title = content.slice(0, 30) + (content.length > 30 ? '…' : '');
  }
  if (type !== 'assistant') {
    state._animateFromIndex = state.currentConversation.messages.length - 1;
  }
  renderConversations();
  renderMessages();
  saveState();
}

function renderConversations() {
  const sceneConvs = currentCharacterConvs();
  if (!sceneConvs || sceneConvs.length === 0) {
    conversationList.innerHTML = '<div class="conv-empty">— 暂无历史对话 —</div>';
    return;
  }
  let html = '';
  for (let i = sceneConvs.length - 1; i >= 0; i--) {
    const conv = sceneConvs[i];
    const isActive = conv.id === state.currentConversation?.id;
    const cid = getConversationCharacter(conv);
    const cdef = state.characters.find(c => c.id === cid) || null;
    const avatar = cdef?.avatar || '🎭';
    const who = cdef ? cdef.name : (cid ? cid : '');
    html += `<div class="conv-item${isActive ? ' active' : ''}" data-conv-id="${conv.id}" title="${escapeHtml(conv.title)}">
      <span class="conv-avatar">${avatar}</span>
      <span class="conv-body">
        <span class="conv-title">${escapeHtml(conv.title)}</span>
        <span class="conv-sub"><span class="conv-who">${escapeHtml(who)}</span><span class="conv-time">${formatConvTime(conv.createdAt || Date.now())}</span></span>
      </span>
      <button class="conv-del" data-delete-id="${conv.id}" title="删除对话">×</button>
    </div>`;
  }
  conversationList.innerHTML = html;

  conversationList.querySelectorAll('.conv-item').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.classList.contains('conv-del')) return;
      const convId = el.dataset.convId;
      const target = state.conversations.find(c => c.id === convId);
      if (target && target !== state.currentConversation) {
        if (state.currentConversation) state.currentConversation._draft = queryInput.value;
        // 标记为从历史列表点开的对话：切换角色时不可被空对话复用逻辑改写归属
        target._fromHistory = true;
        state.currentConversation = target;
        state.sessionId = target.sessionId || crypto.randomUUID();
        state._animateFromIndex = 0;
        // 同步对话对应的角色：该角色的头像常亮（点击历史对话后总是同步）
        const cid = getConversationCharacter(target);
           if (cid) {
             state.currentCharacter = cid;
             applyTheme(themeFor(cid));
             updateEmptyState();
          charCards.querySelectorAll('.char-card').forEach(c =>
            c.classList.toggle('active', c.dataset.charId === cid)
          );
        }
        // 后端权威核对：历史对话的对象优先级最高，后端有记录则强制修正归属
        verifyConversationOwner(target);
        saveState();
        renderConversations();
        renderMessages();
        queryInput.value = target._draft || '';
        autoResize(queryInput);
        closeSidebar();
      }
    });
  });

  conversationList.querySelectorAll('.conv-del').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteConversation(btn.dataset.deleteId);
    });
  });
}

function deleteConversation(convId) {
  const idx = state.conversations.findIndex(c => c.id === convId);
  if (idx === -1) return;
  const deletedConv = state.conversations[idx];
  const wasCurrent = deletedConv.id === state.currentConversation?.id;
  state.conversations.splice(idx, 1);

  if (wasCurrent) {
    const sceneConvs = currentCharacterConvs();
    if (sceneConvs.length > 0) {
      state.currentConversation = sceneConvs[sceneConvs.length - 1];
      state.sessionId = state.currentConversation.sessionId || crypto.randomUUID();
      const cid = getConversationCharacter(state.currentConversation);
        if (cid && cid !== state.currentCharacter) {
          state.currentCharacter = cid;
          applyTheme(themeFor(cid));
          updateEmptyState();
        charCards.querySelectorAll('.char-card').forEach(c =>
          c.classList.toggle('active', c.dataset.charId === cid)
        );
      }
    } else {
      state.currentConversation = null;
      state.sessionId = crypto.randomUUID();
    }
  }

  saveState();
  renderConversations();
  renderMessages();
  queryInput.value = state.currentConversation?._draft || '';
  autoResize(queryInput);

  if (deletedConv.sessionId) {
    fetch('/conversation/' + encodeURIComponent(deletedConv.sessionId), {
      method: 'DELETE',
      keepalive: true,
    }).catch(() => {});
  }
}

// ============================================================
// 消息渲染
// ============================================================
function renderMessages() {
  emptyState.style.display = 'none';
  const msgs = state.currentConversation?.messages || [];
  updateEmptyLayout();
  if (msgs.length === 0) {
    emptyState.style.display = 'flex';
    chatScroll.innerHTML = '';
    chatScroll.appendChild(emptyState);
    return;
  }

  let html = '';
  for (let i = 0; i < msgs.length; i++) {
    const msg = msgs[i];
    const animClass = (i >= state._animateFromIndex) ? ' msg-animate' : '';

    if (msg.type === 'user') {
      html += `
        <div class="message-group${animClass}">
          <div class="message-row user-row">
            <div class="avatar user">👤</div>
            <div class="message-content">
              <div class="user-text">${escapeHtml(msg.content)}</div>
              <div class="message-ts user-ts">${formatTime()}</div>
            </div>
          </div>
        </div>`;
    } else if (msg.type === 'assistant') {
      const agents = msg.extra?.agents || [];
      const badges = agents.length ? agents.map(a =>
        `<span class="agent-badge">${escapeHtml(String(a).replace(/_agent$/, ''))}</span>`
      ).join('') : '';
      const icon = msg.extra?.sceneIcon || getAssistantIcon();
      const recoveredTag = msg.extra?.recovered
        ? '<span class="recovered-tag">刷新后恢复</span>' : '';
      html += `
        <div class="message-group${animClass}">
          <div class="message-row">
            <div class="avatar assistant">${icon}</div>
            <div class="message-content">
              <div class="md-body">${renderMarkdownLite(isImmersiveTheme() ? stripMetaSections(msg.content) : msg.content)}</div>
              ${badges ? `<div class="agent-badges">${badges}</div>` : ''}${recoveredTag}
              <div class="message-ts">${formatTime()}</div>
            </div>
          </div>
        </div>`;
    } else if (msg.type === 'system') {
      html += `
        <div class="message-group${animClass}">
          <div class="message-row center-row">
            <span class="sys-chip">${escapeHtml(msg.content)}</span>
          </div>
        </div>`;
    } else if (msg.type === 'error') {
      html += `
        <div class="message-group${animClass}">
          <div class="message-row center-row">
            <span class="err-chip">${escapeHtml(msg.content)}</span>
          </div>
        </div>`;
    }
  }

  state._animateFromIndex = msgs.length;

  if (state.isLoading) {
    const icon = getAssistantIcon();
    html += `
      <div class="message-group" id="thinkingIndicator">
        <div class="message-row">
          <div class="avatar assistant">${icon}</div>
          <div class="message-content">
            <div class="thinking-indicator">
              <span>正在生成回答</span>
              <div class="thinking-dots"><span></span><span></span><span></span></div>
            </div>
            <div class="thinking-sub" id="thinkingSubtext"></div>
          </div>
        </div>
      </div>`;
  }

  chatScroll.innerHTML = html;
  scrollToBottom();
}

// ============================================================
// SSE 查询
// ============================================================
async function sendQuery(query) {
  if (state.isLoading || !query.trim()) return;

  // 对话归属当前角色，历史列表据此显示头像
  if (state.currentConversation) {
    state.currentConversation.characterId = state.currentCharacter;
  }
  addMessage('user', query);
  queryInput.value = '';
  autoResize(queryInput);
  sendBtn.disabled = true;
  state.isLoading = true;
  state._streamingText = '';
  state._isStreaming = true;
  state._gotToken = false;
  state._reqStart = Date.now();
  setStatus('busy', '思考中');

  const waitTimer = setInterval(() => {
    if (state._gotToken || !state.isLoading) return;
    const secs = Math.max(1, Math.round((Date.now() - state._reqStart) / 1000));
    updateThinkingText(`正在检索资料与思考中（已等待 ${secs} 秒，请勿刷新页面）…`);
  }, 15000);
  renderMessages();

  try {
    const body = { query, session_id: state.sessionId, character_id: state.currentCharacter };
    const msgs = state.currentConversation?.messages || [];
    const pairedHistory = [];
    for (let i = 0; i < msgs.length; i++) {
      const m = msgs[i];
      if (m.type !== 'user' && m.type !== 'assistant') continue;
      if (m.type === 'user') {
        const next = msgs[i + 1];
        if (next && next.type === 'assistant') {
          pairedHistory.push({ type: 'user', content: m.content });
          pairedHistory.push({ type: 'assistant', content: next.content });
          i++;
        }
      } else {
        pairedHistory.push({ type: 'assistant', content: m.content });
      }
    }
    body.history = pairedHistory;

    const resp = await fetch('/persona/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let fullContent = '';
    let routeHistory = [];
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split('\n\n');
      buffer = parts.pop();
      for (const line of parts) {
        if (!line.startsWith('data: ')) continue;
        let data;
        try { data = JSON.parse(line.slice(6)); } catch (e) { continue; }
        switch (data.type) {
          case 'thinking': updateThinkingText(data.content); break;
          case 'token':
            state._gotToken = true;
            state._streamingText += data.content || '';
            updateStreamingBubble();
            break;
          case 'agent_done': updateThinkingText(`正在处理 ${data.agent}…`); break;
          case 'trace': routeHistory = data.route_history || []; break;
          case 'result': fullContent = data.content || ''; break;
          case 'questions':
            fullContent = data.content || '';
            state._pendingQuestions = data.questions || [];
            break;
          case 'error': throw new Error(data.content);
        }
      }
    }

    if (buffer.trim().startsWith('data: ')) {
      try {
        const data = JSON.parse(buffer.trim().slice(6));
        if (data.type === 'result') fullContent = data.content || '';
        if (data.type === 'questions') { fullContent = data.content || ''; state._pendingQuestions = data.questions || []; }
      } catch (e) { /* 忽略 */ }
    }

    state._isStreaming = false;
    state._streamingText = '';
    state.isLoading = false;
    clearInterval(waitTimer);

    if (fullContent) {
      state._msgQueue = [{
        type: 'assistant',
        content: fullContent,
        extra: { agents: routeHistory, sceneIcon: getAssistantIcon() },
      }];
      await processMessageQueue();
    } else {
      addMessage('system', '查询完成，但未返回内容。');
      renderMessages();
    }

  } catch (err) {
    state._isStreaming = false;
    state._streamingText = '';
    state.isLoading = false;
    clearInterval(waitTimer);
    addMessage('error', `查询失败: ${err.message}`);
  }

  state.isLoading = false;
  renderMessages();
  const leftover = document.getElementById('thinkingIndicator');
  if (leftover) leftover.remove();
  const leftoverBubble = document.getElementById('streamingBubble');
  if (leftoverBubble) leftoverBubble.remove();
  sendBtn.disabled = !queryInput.value.trim();
  autoResize(queryInput);
  setStatus('idle', '就绪');
}

function setStatus(mode, text) {
  statusDot.classList.toggle('busy', mode === 'busy');
  statusText.textContent = text;
}

function updateThinkingText(text) {
  const el = document.getElementById('thinkingSubtext');
  if (el) el.textContent = text;
}

function updateStreamingBubble() {
  let bubble = document.getElementById('streamingBubble');
  if (!bubble) {
    const thinking = document.getElementById('thinkingIndicator');
    if (thinking) {
      thinking.outerHTML = `
        <div class="message-group msg-animate" id="streamingBubble">
          <div class="message-row">
            <div class="avatar assistant">${getAssistantIcon()}</div>
            <div class="message-content">
              <div class="md-body streaming-cursor" id="streamingContent"></div>
            </div>
          </div>
        </div>`;
    }
    bubble = document.getElementById('streamingBubble');
  }
  if (bubble) {
    const contentEl = document.getElementById('streamingContent');
    if (contentEl) contentEl.innerHTML = renderMarkdownLite(isImmersiveTheme() ? stripMetaSections(state._streamingText) : state._streamingText);
    scrollToBottom();
  }
}

// ============================================================
// 轻量 Markdown 渲染（流式 + 最终消息通用）
// ============================================================
function isImmersiveTheme() {
  const t = themeFor(state.currentCharacter) || document.body.dataset.theme;
  return t === 'street' || t === 'live';
}

// 沉浸主题：剥离「要点/关键点/来源/引用」等出戏段落
function stripMetaSections(text) {
  if (!text) return text;
  const lines = text.split('\n');
  const out = [];
  let skipBullets = false;
  for (let i = 0; i < lines.length; i++) {
    const t = lines[i].trim();
    const isMetaHeader = /^\*{0,2}(要点|关键点|核心要点|来源|引用|参考资料|参考)\*{0,2}[:：]/.test(t);
    const isMetaQuote = /^>\s*(以上|来源|引用|参考)/.test(t);
    const isFixture = /^以上(为|是)/.test(t);
    if (isMetaHeader || isMetaQuote || isFixture) {
      skipBullets = true;
      continue;
    }
    if (skipBullets) {
      if (t === '' || /^[-*•]/.test(t) || /^>\s*/.test(t)) continue;
      skipBullets = false;
    }
    out.push(lines[i]);
  }
  return out.join('\n');
}

function renderMarkdownLite(text) {
  if (!text) return '';
  let html = escapeHtml(text);
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/(?:^|&lt;br&gt;)\s*\*([^*&lt;]+)\*/gm, '<span class="action-text">$1</span>');
  html = html.replace(/(?:^|&lt;br&gt;)\s*(\u3010[^\u3011]+\u3011)/g, '<span class="action-text">$1</span>');
  html = html.replace(/(?:^|&lt;br&gt;)\s*(\uff08[^\uff09]+\uff09)/g, '<span class="action-text">$1</span>');
  html = html.replace(/(?:^|&lt;br&gt;)\s*(\([^)]+\))/g, '<span class="action-text">$1</span>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/\n\n/g, '</p><p>');
  html = html.replace(/\n/g, '<br>');
  html = '<p>' + html + '</p>';
  html = html.replace(/<p>\s*<\/p>/g, '');
  return html;
}

// ============================================================
// 消息队列
// ============================================================
async function processMessageQueue() {
  const streamingBubble = document.getElementById('streamingBubble');
  if (streamingBubble) streamingBubble.remove();

  while (state._msgQueue.length > 0) {
    const msgData = state._msgQueue.shift();
    if (!state.currentConversation) newConversation();
    state.currentConversation.messages.push({ ...msgData, time: Date.now() });
    renderMessages();
    if (state._msgQueue.length > 0) {
      await new Promise(r => setTimeout(r, 700));
    }
  }
  saveState();
}

// ============================================================
// 刷新后恢复未收到的回答
// ============================================================
async function recoverPendingAnswer() {
  const conv = state.currentConversation;
  if (!conv || !conv.sessionId) return;
  const msgs = conv.messages || [];
  if (msgs.length === 0) return;
  const last = msgs[msgs.length - 1];
  if (last.type !== 'user') return;

  const pendingQuery = last.content;
  const systemMsg = {
    type: 'system',
    content: '⏳ 检测到上一轮回答未收到，正在从后端恢复…',
    extra: {},
    time: Date.now(),
  };
  msgs.push(systemMsg);
  saveState();
  renderMessages();

  const url = '/conversation/pending/' + encodeURIComponent(conv.sessionId);
  const deadline = Date.now() + 120000;
  while (Date.now() < deadline) {
    if (state.currentConversation !== conv) return;
    if (!state.conversations.includes(conv)) return;
    if (msgs[msgs.length - 1] !== systemMsg) return;
    try {
      const resp = await fetch(url);
      if (resp.ok) {
        const data = await resp.json();
        if (data.final_answer && data.query === pendingQuery) {
          if (state.currentConversation !== conv) return;
          const idx = msgs.indexOf(systemMsg);
          if (idx === -1) return;
          msgs.splice(idx, 1, {
            type: 'assistant',
            content: data.final_answer,
            extra: {
              agents: data.route_history || [],
              sceneIcon: getAssistantIcon(),
              recovered: true,
            },
            time: Date.now(),
          });
          if (data.info_gap_questions && data.info_gap_questions.length > 0) {
            state._pendingQuestions = data.info_gap_questions;
          }
          saveState();
          renderMessages();
          scrollToBottom();
          return;
        }
        if (data.final_answer && data.query !== pendingQuery) {
          systemMsg.content = '⚠️ 上一轮回答未能恢复（与当前问题不匹配），请重新提问。';
          saveState();
          renderMessages();
          return;
        }
      }
    } catch (e) { /* 网络瞬时错误，继续轮询 */ }
    await new Promise(r => setTimeout(r, 2000));
  }
  systemMsg.content = '⏳ 等待超时，上一轮回答未能恢复，请重新提问。';
  saveState();
  renderMessages();
}

queryInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendQuery(queryInput.value);
  }
});

queryInput.addEventListener('input', () => {
  autoResize(queryInput);
  sendBtn.disabled = !queryInput.value.trim() || state.isLoading;
});

newChatBtn.addEventListener('click', () => { showHome(); });

document.getElementById('menuBtn').addEventListener('click', openSidebar);
sidebarMask.addEventListener('click', closeSidebar);
document.querySelector('.brand').addEventListener('click', showHome);
document.getElementById('backTopBtn').addEventListener('click', showHome);
document.getElementById('backHomeBtn').addEventListener('click', showHome);

// 初始化
// ============================================================
const restored = loadState();
if (restored && state.currentConversation) {
  queryInput.placeholder = '想与 TA 谈些什么…';
  updateEmptyState();
  renderConversations();
  renderMessages();
  queryInput.value = state.currentConversation._draft || '';
  autoResize(queryInput);

  homeView.classList.add('hidden');

} else {
  state.view = 'home';
  homeView.classList.remove('hidden');
  renderHome();
  console.log('[App] 全新初始化, 等待选择对话对象');
}

fetch('/health').then(r => r.json()).then(d => {
  console.log('[Health]', d.message);
  setStatus('idle', '就绪');
}).catch(() => setStatus('busy', '服务未连接'));

applyTheme(themeFor(state.currentCharacter));
loadCharacters();
